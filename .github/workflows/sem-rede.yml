# Garante que docs/index.html (+ docs/dados.js, docs/app.js, docs/estilos.css)
# continua 100% offline — não é conveniência, é a fronteira de privacidade:
# este formulário digita CPF/endereço de autores, então "roda só no
# navegador" precisa ser verificável, não só prometido no texto da página.
#
# Dois checks:
#   1. Em nenhum dos quatro arquivos (com o bloco vendorizado removido de
#      docs/index.html primeiro), nenhuma referência de rede.
#   2. Dentro do bloco vendorizado, o conteúdo não muda sem que alguém
#      atualize o hash de referência no mesmo commit — ninguém revisa 500KB
#      de código minificado linha a linha num diff, então uma alteração
#      silenciosa ali passaria batida sem essa trava.

name: Verificar isolamento de rede

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sem-rede:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sem referência de rede fora do bloco vendorizado
        run: |
          set -euo pipefail
          sed '/BEGIN VENDOR/,/END VENDOR/d' docs/index.html > /tmp/sem-vendor.html
          # ALLOW-REDE-LINK-CITACAO: as duas únicas linhas de dados.js com uma
          # URL de citação estática (o professor clica, nada é carregado pela
          # página) — ver o comentário ao lado delas em docs/dados.js.
          grep -v 'ALLOW-REDE-LINK-CITACAO' docs/dados.js > /tmp/dados-sem-links-citacao.js
          if grep -EnI 'https?://|fetch\(|XMLHttpRequest|import\(|sendBeacon|new Worker|WebSocket|EventSource' \
              /tmp/sem-vendor.html /tmp/dados-sem-links-citacao.js docs/app.js docs/estilos.css; then
            echo "" >&2
            echo "Referência de rede encontrada fora do bloco vendorizado — estes arquivos precisam continuar 100% offline." >&2
            exit 1
          fi
          echo "Nenhuma referência de rede fora do bloco vendorizado."

      - name: Hash do bloco vendorizado confere
        run: |
          set -euo pipefail
          sed -n '/BEGIN VENDOR/,/END VENDOR/p' docs/index.html \
            | sha256sum | awk '{print $1"  index.html.vendor-block"}' > /tmp/hash-atual.sha256
          if ! diff -u .github/vendor-pdf-lib.sha256 /tmp/hash-atual.sha256; then
            echo "" >&2
            echo "O bloco vendorizado mudou. Se foi intencional (ex.: atualizar o pdf-lib)," >&2
            echo "recalcule e substitua .github/vendor-pdf-lib.sha256 no MESMO commit." >&2
            exit 1
          fi
          echo "Hash do bloco vendorizado confere."
